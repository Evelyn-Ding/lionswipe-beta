name: Scrape curated restaurants

on:
  # Disabled: scripts/scrape-restaurants.js was removed in the "simplified
  # features" cleanup (cfee1da), so the scheduled run just fails instantly.
  # Re-enable the cron trigger below if the curated-restaurants feature and
  # its scraper script come back.
  # schedule:
  #   - cron: "0 9 * * 1"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/scrape-restaurants.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
