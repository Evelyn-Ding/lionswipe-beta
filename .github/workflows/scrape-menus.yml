name: Scrape dining menus

on:
  schedule:
    # Every 30 minutes. GitHub Actions scheduled runs are best-effort and can
    # land late (observed gaps up to several hours during low-load periods) or
    # occasionally get skipped entirely — running every 30 min rather than
    # every 2+ hours mainly buys more chances for one of them to land on time,
    # not a guarantee. api/menus.js falls back to fetching liondine directly if
    # today's Supabase row is missing/stale, so a slow cron here degrades
    # gracefully rather than showing wrong data.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/scrape-menus.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
