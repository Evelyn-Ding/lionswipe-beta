name: Scrape dining menus

on:
  schedule:
    # Once daily at 12:00 UTC — 8:00 AM ET during EDT (summer/fall, most of the
    # semester), 7:00 AM ET during EST (winter), since GitHub Actions cron has no
    # DST awareness. Picked so it always lands in the 7-8 AM ET window either way.
    # GitHub Actions scheduled runs can also land 15-60+ min late under load —
    # use workflow_dispatch below (or re-run from the Actions tab) if today's
    # menus look stale.
    - cron: "0 12 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/scrape-menus.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
