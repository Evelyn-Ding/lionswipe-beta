name: Scrape dining menus

on:
  schedule:
    # 7, 8, 9, 10, 11am, and 4pm America/New_York (11:00, 12:00, 13:00, 14:00,
    # 15:00, 20:00 UTC — EDT offset, so these run ~1hr earlier in real ET time
    # during EST/winter since GitHub Actions cron has no DST awareness) —
    # adjust as needed.
    - cron: "0 11,12,13,14,15,20 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node scripts/scrape-menus.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
